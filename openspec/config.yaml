schema: spec-driven
githubCopilot:
  cloudAgent: true

context: |
  Project: PixelCode — Sistema de gestão para barbearia.

  Domain: Agendamento de serviços de barbearia, com gestão de
  clientes, funcionários, serviços oferecidos e pagamentos.

  Tech stack: Backend em Xano (banco de dados e API REST).
  Frontend em Reflex (framework Python).

  Architecture: Regras de negócio e persistência ficam no
  backend (Xano). O frontend não deve ser tratado como
  mecanismo de segurança.

  Development: O projeto é desenvolvido incrementalmente,
  utilizando OpenSpec para planejar e revisar cada mudança
  antes de implementá-la.

  Language: Escrever a documentação do projeto e os artefatos
  OpenSpec em português brasileiro.

rules:
  proposal:
    - Descrever claramente o problema, objetivo e escopo.
    - Identificar o que está fora do escopo quando necessário.

  specs:
    - Escrever requisitos verificáveis.
    - Utilizar cenários para comportamentos relevantes.

  tasks:
    - Dividir a implementação em tarefas pequenas e verificáveis.

operations:
  apply:
    guidance:
      - Executar verificações relevantes antes de concluir.

  archive:
    guidance:
      - Confirmar que a implementação corresponde à especificação.