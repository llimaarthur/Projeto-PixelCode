<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" role="img" aria-labelledby="title desc">
  <title id="title">Prévia do catálogo de serviços da Lotus Barber</title>
  <desc id="desc">Tela conceitual do painel interno em tema escuro, com navegação lateral, resumo do catálogo, busca e tabela de serviços com preço, duração e status.</desc>
