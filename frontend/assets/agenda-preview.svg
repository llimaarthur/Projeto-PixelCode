      <text x="1258" y="577" text-anchor="middle" class="sans" fill="#c6d1e6" font-size="10">Editar</text>
      <rect x="1297" y="558" width="78" height="29" rx="6" fill="#222731" stroke="#414a59"/>
      <text x="1336" y="577" text-anchor="middle" class="sans" fill="#c6d1e6" font-size="10">Confirmar</text>
      <rect x="1383" y="558" width="84" height="29" rx="6" fill="#2b1d21" stroke="#71383d"/>
