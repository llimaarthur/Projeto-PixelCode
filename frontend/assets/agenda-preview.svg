    <path d="M258 0v1000" stroke="#303540"/>
    <path d="M0 0h258v5H0z" fill="#4b7ff0"/>
    <path d="M62 0h14v5H62zm19 0h10v5H81zm16 0h18v5H97z" fill="#dce5f8"/>
    <path d="M112 0h14v5h-14z" fill="#d94b54"/>
    <path d="M129 0h44v5h-44z" fill="#4b7ff0"/>

    <rect x="28" y="34" width="42" height="42" rx="12" fill="#2b57ad" stroke="#5279ca"/>
    <path d="M49 42c-3 6-9 9-9 17a9 9 0 0 0 18 0c0-8-6-11-9-17zm0 12c2 2 4 4 4 6a4 4 0 0 1-8 0c0-2 2-4 4-6z" fill="#fff"/>
    <text x="82" y="53" class="sans white" font-size="15" font-weight="700">Lotus Barber</text>
    <text x="82" y="69" class="sans muted" font-size="9" font-weight="650" letter-spacing="1.25">GESTÃO DA BARBEARIA</text>

    <text x="29" y="126" class="sans subtle smallcaps">MENU PRINCIPAL</text>

