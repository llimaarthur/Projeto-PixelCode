<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title description">
  <title id="title">Prévia da página Agenda — Lotus Barber</title>
  <desc id="description">Painel escuro de barbearia com navegação lateral, seleção de profissional e data, e lista de atendimentos diários.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#131822"/>
      <stop offset=".45" stop-color="#0d0f13"/>
      <stop offset="1" stop-color="#101319"/>
    </linearGradient>
    <linearGradient id="sidebar" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#1b2029"/>
      <stop offset="1" stop-color="#15171c"/>
    </linearGradient>
    <linearGradient id="button" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#5687f5"/>
      <stop offset="1" stop-color="#3868d1"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#1c2027"/>
      <stop offset="1" stop-color="#181a20"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#000" flood-opacity=".22"/>
    </filter>
    <style>
      .sans{font-family:Inter,"Segoe UI",Arial,sans-serif}
      .muted{fill:#a7abb4}
      .subtle{fill:#858b96}
      .white{fill:#f4f5f7}
      .smallcaps{font-size:10px;font-weight:700;letter-spacing:1.6px}
      .body{font-size:13px}
      .small{font-size:11px}
    </style>
  </defs>

  <rect width="1600" height="1000" fill="url(#background)"/>

  <g aria-label="Navegação lateral">
